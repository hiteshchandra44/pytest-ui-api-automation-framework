[browser]
; Browser to run UI tests with (example: chrome, firefox, edge)
browser = chrome
; Run the browser without a visible UI (true/false)
headless = false

[urls]
; Base URL for UI automation
; Notes App base URL (separate UI app under /notes/app)
base_url = https://practice.expandtesting.com/notes/app
; Base URL for API automation
api_base_url = https://practice.expandtesting.com/notes/api
; Notes App direct URLs
notes_login_url = https://practice.expandtesting.com/notes/app/login
notes_register_url = https://practice.expandtesting.com/notes/app/register

[timeouts]
; All timeouts are in seconds
implicit_wait = 10
explicit_wait = 15
page_load_timeout = 90

[api]
; Default content type header for API requests
content_type = application/json

; Test credentials for UI automation (no hardcoded credentials in tests).
; IMPORTANT: Replace these with valid credentials for your environment.
; Notes App UI credentials (email + password).
; NOTE: These must be a registered account on the Notes App UI.
username = hiteshchandraobili@gmail.com
password = Hitesh@123

; An email that is already registered (used for negative registration tests).
already_registered_email = hiteshchandraobili@gmail.com

; If username is empty/missing, set it to already_registered_email.
; (Kept here as a reminder; do not duplicate keys.)

; Default passwords used by automated registration/login in tests.
; Keeping them here avoids hardcoding in Python files.
default_password = Password@12345
new_password = NewPassword@123
wrong_password = WrongPassword@123
short_password = 123

; Sample values used in negative UI tests (not real accounts).
invalid_username_email = test@example.com

