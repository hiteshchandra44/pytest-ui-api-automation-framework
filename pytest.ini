[pytest]
; This file controls how pytest discovers and runs tests.

; Where pytest should look for tests
testpaths =
    tests

; Show live logs in the terminal while tests run
log_cli = true

; Default command line options for every run:
; -n auto            => run tests in parallel using as many CPU cores as available (pytest-xdist)
; --reruns/--reruns-delay => automatically retry a failing test once (pytest-rerunfailures)
; NOTE: We do not set --html here because UI/API runs must generate separate reports.
addopts = -n auto --reruns 1 --reruns-delay 2

markers =
    smoke: smoke test subset
    regression: full regression suite
    positive: positive scenario
    negative: negative scenario
    ui: UI selenium test
    api: API test

