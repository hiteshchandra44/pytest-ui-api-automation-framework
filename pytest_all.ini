[pytest]
; pytest_all.ini
;
; Run configuration for ALL tests (UI + API).
; HTML reports: use `python utilities/run_tests.py all` for
; reports/full_report_YYYY-MM-DD_HH-MM-SS.html (timestamped; preserves history).

testpaths =
    tests

; -n auto runs tests in parallel (pytest-xdist).
; --reruns retries once to reduce random flakiness.
; Pass --html=... on the CLI or use utilities/run_tests.py for timestamped reports.
addopts = -n auto --reruns 1 --reruns-delay 2

