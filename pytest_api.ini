[pytest]
; pytest_api.ini
;
; Run configuration for API tests only.
; HTML report + plain-text log are auto-generated with timestamps by conftest.py:
;   reports/api_report_YYYY-MM-DD_HH-MM-SS.html
;   reports/api_log_YYYY-MM-DD_HH-MM-SS.txt
;
; Usage:
;   pytest -c pytest_api.ini
;   python utilities/run_tests.py api

testpaths =
    tests/api

; --reruns 1  : retry each failing test once to reduce random flakiness.
; --reruns-delay 2 : wait 2 s before the retry.
addopts = --reruns 1 --reruns-delay 2

; ----- Live console log (visible while tests run) ---------------------
log_cli            = true
log_cli_level      = INFO
log_cli_format     = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

; ----- File log (timestamped path injected by conftest.py) -----------
; log_file / log_file_level are set dynamically in conftest.py.
; You can still override log_file_level here if you prefer a different level.
log_file_level     = DEBUG
log_file_format    = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: smoke test subset
    regression: full regression suite
    positive: positive scenario
    negative: negative scenario
    ui: UI selenium test
    api: API requests test