[pytest]
; pytest_stability.ini
;
; Run configuration for stability / flakiness checks (all tests, no reruns).
; HTML report + plain-text log are auto-generated with timestamps by conftest.py:
;   reports/stability_report_YYYY-MM-DD_HH-MM-SS.html
;   reports/stability_log_YYYY-MM-DD_HH-MM-SS.txt
;
; IMPORTANT: --reruns is intentionally omitted so flaky tests are visible.
;
; Usage:
;   pytest -c pytest_stability.ini
;   python utilities/run_tests.py stability   (or run_all_10_times.*)

testpaths =
    tests

; -n 4 : run tests in parallel across 4 workers (pytest-xdist).
addopts = -n 4

; ----- Live console log (visible while tests run) ---------------------
log_cli            = true
log_cli_level      = INFO
log_cli_format     = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

; ----- File log (timestamped path injected by conftest.py) -----------
; log_file / log_file_level are set dynamically in conftest.py.
; You can still override log_file_level here if you prefer a different level.
log_file_level     = DEBUG
log_file_format    = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: smoke test subset
    regression: full regression suite
    positive: positive scenario
    negative: negative scenario
    ui: UI selenium test
    api: API requests test